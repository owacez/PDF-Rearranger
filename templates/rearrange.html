<!DOCTYPE html>
<html>

<head>
    <title>Rearrange Pages</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        body { font-family: Arial,sans-serif; text-align: center; }

        .container {
            display: flex;
            flex-wrap: wrap;
            width: 600px;
            margin: auto;
        }

        .page {
            margin: 10px;
            cursor: grab;
        }

        .page img {
            width: 120px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
input[type="file"] {
    font-size: 14px;
    color: #333;
    padding: 6px;
}

/* Style the actual "Choose File" button */
input[type="file"]::file-selector-button {
    background: linear-gradient(135deg, #8900AE, #5d0076);
    color: white;
    border: none;
    padding: 10px 16px;
    margin-right: 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}

/* Hover effect (same vibe as your main button) */
input[type="file"]::file-selector-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(0,0,0,0.2);
}

/* Active click */
input[type="file"]::file-selector-button:active {
    transform: translateY(0);
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
       button {
    position: relative;
    overflow: hidden;

    background: linear-gradient(135deg, #8900AE, #5d0076);
    color: white;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* Shine layer */
button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
        120deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.4) 50%,
        rgba(255,255,255,0) 100%
    );
    transform: skewX(-20deg);
}

/* Hover effects */
button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.2);
}

/* Animate shine */
button:hover::before {
    left: 125%;
    transition: left 0.6s ease;
}

/* Click feel */
button:active {
    transform: translateY(0);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
    </style>
</head>

<body>

    <h2>Drag to Rearrange Pages</h2>

    <div id="pages" class="container">
        {% for img in images %}
        <div class="page" data-id="{{ loop.index }}">
            <img src="{{ url_for('static', filename=img) }}" alt="image">
            <p>Page {{ loop.index }}</p>
        </div>
        {% endfor %}
    </div>

    <form action="/process" method="post" onsubmit="prepareOrder()">
        <input type="hidden" name="order" id="order">
        <input type="hidden" name="filename" value="{{filename}}">
        <button type="submit">Download Rearranged PDF</button>
    </form>

    <script>
        new Sortable(document.getElementById('pages'), {
            animation: 150
        });
    
        function prepareOrder() {
            let items = document.querySelectorAll('.page');
            let order = [];
            items.forEach(item => order.push(item.getAttribute('data-id')));
            document.getElementById('order').value = order.join(',');
        }
    </script>

</body>

</html>
